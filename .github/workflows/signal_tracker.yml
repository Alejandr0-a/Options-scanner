name: Signal Tracker

on:
  schedule:
    # Every 5 minutes during market hours (UTC)
    # Covers 9:00 AM - 5:00 PM ET in both EST (UTC-5) and EDT (UTC-4)
    - cron: '*/5 13-21 * * 1-5'
  workflow_dispatch:  # Allows manual runs

# Prevent overlapping runs - cancel older if new one starts
concurrency:
  group: signal-tracker
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  track-signals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install httpx

      - name: Run signal tracker
        env:
          UW_API_TOKEN: ${{ secrets.UW_API_TOKEN }}
        run: python signal_collector.py

      - name: Commit and push results
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add signal_database.json
          if git diff --staged --quiet; then
            echo "No new signals to commit"
          else
            git commit -m "Update signals $(date -u +%Y-%m-%d_%H:%M)"
            git pull --rebase --autostash origin main || true
            git push
          fi
