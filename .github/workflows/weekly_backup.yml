name: Weekly Signal Backup

on:
  schedule:
    - cron: '0 22 * * 5'  # Friday 10 PM UTC (5 PM ET after market close)
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create weekly backup
        run: |
          mkdir -p backups
          BACKUP_DATE=$(date -u +%Y%m%d)
          cp signal_database.json "backups/signal_database_${BACKUP_DATE}.json"
          echo "Backup created: backups/signal_database_${BACKUP_DATE}.json"

      - name: Commit and push backup
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "Weekly backup $(date -u +%Y-%m-%d)"
          git push
